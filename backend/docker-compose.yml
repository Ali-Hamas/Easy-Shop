services:
  api:
    build: .
    env_file: .env
    environment:
      HOST: 0.0.0.0
    ports:
      - "127.0.0.1:4000:4000"
    init: true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/v1/health/ready >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
